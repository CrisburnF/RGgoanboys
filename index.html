    <style>
        :root {
            --goan-gold: #FFD700;
            --accent-blue: #0dcaf0;
            --bg-primary: #050A18;
            --bg-card: rgba(255,255,255,0.04);
            --bg-card-border: rgba(255,255,255,0.08);
            --text-primary: #ffffff;
            --text-muted: rgba(255,255,255,0.55);
            --navbar-bg: rgba(5,10,24,0.85);
            --navbar-scrolled: rgba(2,4,10,0.98);
            --footer-bg: #020305;
            --form-bg: rgba(255,255,255,0.05);
            --form-border: rgba(255,255,255,0.1);
            --socials-bg: rgba(255,255,255,0.03);
            --socials-border: rgba(255,255,255,0.05);
        }

        html { scroll-padding-top: 110px; }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ── LOADING SCREEN ── */
        #loader {
            position: fixed; inset: 0;
            background: #050A18;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        #loader img { width: 220px; height: 220px; aspect-ratio: 1/1; border-radius: 50%; border: 4px solid var(--goan-gold); background: #fff; object-fit: cover; animation: loaderPulse 1.5s ease-in-out infinite; }
        #loader p { color: var(--goan-gold); font-weight: 700; letter-spacing: 3px; text-transform: uppercase; font-size: 0.8rem; margin-top: 20px; }
        @keyframes loaderPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,215,0,0.5); } 50% { box-shadow: 0 0 0 20px rgba(255,215,0,0); } }

        /* ── NAVBAR ── */
        .festival-bar {
            position: fixed; top: 0; left: 0; width: 100%;
            z-index: 1100;
            background: linear-gradient(45deg,#FFD700,#FDB931);
            color: #000 !important; text-decoration: none;
            font-weight: 700; font-size: 0.82rem;
            text-align: center; padding: 9px 12px;
            line-height: 1.3; letter-spacing: 0.3px;
            display: block;
            box-shadow: 0 2px 12px rgba(0,0,0,0.35);
            transition: filter 0.3s;
        }
        .festival-bar:hover { filter: brightness(1.08); color:#000 !important; }
        .festival-bar strong { text-decoration: underline; white-space: nowrap; }

        .navbar {
            background: var(--navbar-bg) !important;
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,215,0,0.15);
            padding: 0.5rem 0;
            z-index: 1000;
            transition: all 0.3s ease;
        }
        .navbar.fixed-top { top: 39px; }

        .navbar-brand {
            font-weight: 900; letter-spacing: 1.5px;
            color: var(--goan-gold) !important;
            font-size: 1.1rem; text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
        }
        .nav-logo {
            height: 60px; width: 60px; border-radius: 50%;
            object-fit: contain; border: 2px solid var(--goan-gold);
            background-color: #fff; flex-shrink: 0;
            padding: 2px;
        }
        .footer-logo {
            height: 160px; width: 160px; border-radius: 50%;
            object-fit: contain; border: 4px solid var(--goan-gold);
            margin-bottom: 25px; background-color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 4px;
        }
        .nav-link { font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; font-size: 0.85rem; color: var(--text-primary) !important; }
        .nav-link:hover { color: var(--goan-gold) !important; }
        [data-theme="light"] .navbar-toggler-icon { filter: invert(1); }

        /* ── HERO ── */
        .hero-section {
            height: 100vh;
            background: linear-gradient(rgba(5,10,24,0.7), rgba(5,10,24,0.95)),
                        url('https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center; background-attachment: fixed;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .hero-title { font-size: clamp(2.8rem,8vw,6.5rem); font-weight: 900; line-height: 1.05; margin-bottom: 25px; text-transform: uppercase; text-shadow: 0 10px 30px rgba(0,0,0,0.5); color: #fff; }
        .hero-subtitle { color: var(--goan-gold); letter-spacing: 6px; text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 1.5rem; font-size: 0.9rem; }

        /* ── CARDS ── */
        .custom-card {
            background: var(--bg-card);
            border: 1px solid var(--bg-card-border);
            border-radius: 24px; overflow: hidden;
            transition: all 0.4s ease;
            height: 100%; display: flex; flex-direction: column;
        }
        .custom-card:hover {
            transform: translateY(-8px);
            border-color: rgba(255,215,0,0.6);
            box-shadow: 0 20px 50px rgba(0,0,0,0.4), 0 0 30px rgba(255,215,0,0.15);
        }
        a.custom-card { text-decoration: none; color: inherit; }
        .click-hint { display: inline-flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--goan-gold); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-top: 8px; }
        .card-img-wrapper { overflow: hidden; position: relative; }
        .card-img { height: 350px; object-fit: cover; width: 100%; transition: transform 0.6s ease; object-position: top; }
        .custom-card:hover .card-img { transform: scale(1.05); }

        /* Instagram hover overlay on past events */
        .ig-overlay {
            position: absolute; inset: 0;
            background: rgba(193,53,132,0);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: all 0.3s ease;
        }
        .ig-overlay i { font-size: 2.5rem; color: #fff; }
        .past-card-link:hover .ig-overlay { background: rgba(193,53,132,0.65); opacity: 1; }

        /* ── STATS ── */
        .stat-number { font-size: 2rem; font-weight: 900; color: var(--goan-gold); }

        /* ── BUTTONS ── */
        .btn-gold { background: linear-gradient(45deg,#FFD700,#FDB931); color: #000 !important; font-weight: 800; border: none; padding: 12px 35px; border-radius: 50px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; text-decoration: none; }
        .btn-gold:hover { box-shadow: 0 0 25px rgba(255,215,0,0.5); transform: translateY(-2px); }
        .btn-custom-outline { display: block; width: 100%; padding: 15px; border: 1px solid rgba(255,255,255,0.2); color: var(--text-primary); background: transparent; border-radius: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; font-size: 0.9rem; transition: all 0.3s ease; text-decoration: none; text-align: center; }
        .btn-custom-outline:hover { border-color: var(--goan-gold); background: var(--goan-gold); color: #000; }

        /* ── SECTION TITLES ── */
        .section-title { font-weight: 900; text-transform: uppercase; letter-spacing: 1.5px; border-left: 5px solid var(--goan-gold); padding-left: 20px; color: var(--text-primary); }

        /* ── FORM ── */
        .form-control { background: var(--form-bg); border: 1px solid var(--form-border); color: var(--text-primary); padding: 15px; border-radius: 12px; }
        .form-control:focus { background: var(--form-bg); color: var(--text-primary); border-color: var(--goan-gold); box-shadow: none; }
